<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's For Dinner</title>
    <link rel="icon" href="./imgs/favicon.png" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Start  Header  -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <header>
          <div class="header-card d-flex justify-content-between">
            <div class="d-flex">
              <div class="header-icon">
                <i class="fa-solid fa-utensils"></i>
              </div>
              <div>
                <h1>What's For Dinner</h1>
                <p>Your daily meal inspiration</p>
              </div>
            </div>
          </div>
        </header>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <div class="header-card">
                  <div class="icons d-flex align-items-center">
                    <span class="mt-3 mt-lg-0"><i class="fa-solid fa-bookmark"></i> <span class="d-lg-none">Saved Recieps</span></span>
                    <span><i class="fa-solid fa-clock-rotate-left"></i> <span class="d-lg-none">Recent</span></span>
                    <span><i class="fa-solid fa-gear me-2"></i> <span class="d-lg-none">Settings</span></span>
                    <figure>
                    <img src="./imgs/avatar-4.jpg" alt="User Photo" />
                    <span class="m-0 d-lg-none">Profile</span>
                    </figure>
                  </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- End  Header  -->
    <!-- Start Main  -->
    <main>
      <div class="container">
        <div class="row g-0">
          <div class="col-lg-5">
            <div class="inner">
              <div class="image-section position-relative">
  <figure>
    <img id="recipe-image" src="" alt="Recipe Photo" />
  </figure>

  <div class="rating">
    <i class="fa-solid fa-star" style="color: #facc15; margin-right: 0.25rem"></i>
    <span class="rate" id="recipe-rating"></span>
    <span class="reviews" id="recipe-reviews"></span>
  </div>

  <div class="info-from-meal">
    <div>
      <span class="clock-icon icon"><i class="fa-solid fa-clock"></i></span>
      <span class="info-title">Prep Time</span>
      <span id="prep-time"></span>
    </div>

    <div>
      <span class="fire-icon icon"><i class="fa-solid fa-fire-burner"></i></span>
      <span class="info-title">Cook Time</span>
      <span id="cook-time"></span>
    </div>

    <div>
      <span class="users-icon icon"><i class="fa-solid fa-users"></i></span>
      <span class="info-title">Servings</span>
      <span id="servings"></span>
    </div>
  </div>
</div>
            </div>
          </div>
          <div class="col-lg-7">
  <div class="inner">
    <div class="text-section">
      
      <div class="text-icon" id="recipe-badges">
        <span class="badge badge-1"></span>
        <span class="badge badge-2"></span>
      </div>

      <div class="icons-text d-flex justify-content-between mb-4">
        <div class="text-title">
          <h3 id="recipe-title"></h3>
          <p id="recipe-description"></p>
        </div>
        <div class="icon-title d-flex">
          <div class="book-icon">
            <i class="fa-solid fa-bookmark"></i>
          </div>
          <div>
            <i class="fa-solid fa-share-nodes"></i>
          </div>
        </div>
      </div>
      <div id="alert-text">
        
      </div>
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">
            <i class="fa-solid fa-list-check"></i> Ingredients
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">
            <i class="fa-solid fa-book-open"></i> Instructions
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">
            <i class="fa-solid fa-chart-pie"></i> Nutrition
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="chef-tab" data-bs-toggle="tab" data-bs-target="#chef-tab-pane" type="button" role="tab" aria-controls="chef-tab-pane" aria-selected="false">
            <i class="fa-solid fa-lightbulb"></i> Chef's Tips
          </button>
        </li>
      </ul>

      <div class="tab-content" id="myTabContent">
        
        <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
          <div class="ingredients">
            <ul id="recipe-ingredients">
              <li><div>1</div><span></span></li>
              <li><div>2</div><span></span></li>
              <li><div>3</div><span></span></li>
              <li><div>4</div><span></span></li>
              <li><div>5</div><span></span></li>
              <li><div>6</div><span></span></li>
              <li><div>7</div><span></span></li>
              <li><div>8</div><span></span></li>
              <li><div>9</div><span></span></li>
            </ul>
          </div>
        </div>

        <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
          <div class="instructions" id="recipe-instructions">
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>1</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>2</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>3</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>4</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>5</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
            <div class="d-flex align-items-center mb-4">
              <div class="number"><span>6</span></div>
              <div class="parg-1">
                <p></p>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">
          <div class="row g-3">
            
            <div class="col-md-6">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn fire-iconn"><i class="fa-solid fa-fire"></i></div>
                  <span>Calories</span>
                </div>
                <div id="nutr-calories"></div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn dumble-iconn"><i class="fa-solid fa-dumbbell"></i></div>
                  <span>Protein</span>
                </div>
                <div id="nutr-protein"></div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn wheat-iconn"><i class="fa-solid fa-wheat-awn"></i></div>
                  <span>Carbohydrates</span>
                </div>
                <div id="nutr-carbs"></div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn droplet-iconn"><i class="fa-solid fa-droplet"></i></div>
                  <span>Fat</span>
                </div>
                <div id="nutr-fat"></div>
              </div>
            </div>

            <div class="col-md-6 d-none d-md-block">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn seedling-iconn"><i class="fa-solid fa-seedling"></i></div>
                  <span>Fiber</span>
                </div>
                <div id="nutr-fiber"></div>
              </div>
            </div>

            <div class="col-md-6 d-none d-md-block">
              <div class="nutrition-bg d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                  <div class="iconn cube-iconn"><i class="fa-solid fa-cube"></i></div>
                  <span>Sodium</span>
                </div>
                <div id="nutr-sodium"></div>
              </div>
            </div>

          </div>
        </div>

        <div class="tab-pane fade" id="chef-tab-pane" role="tabpanel" aria-labelledby="chef-tab" tabindex="0">
          <div id="recipe-chef-tips-container">
            <div class="chef-tips">
              <div><i class="fa-solid fa-circle-check"></i></div>
              <p></p>
            </div>
            <div class="chef-tips">
              <div><i class="fa-solid fa-circle-check"></i></div>
              <p></p>
            </div>
            <div class="chef-tips">
              <div><i class="fa-solid fa-circle-check"></i></div>
              <p></p>
            </div>
            <div class="chef-tips">
              <div><i class="fa-solid fa-circle-check"></i></div>
              <p></p>
            </div>
          </div>
        </div>

      </div>

      <div class="text-but">
        <button id="btn-next-recipe">
          <i class="fa-solid fa-rotate"></i> Try Another Recipe
        </button>
      </div>

    </div>
  </div>
</div>
        </div>
      </div>
    </main>
    <!-- End Main  -->

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
